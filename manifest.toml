#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "openfire"
name = "Openfire"
description.en = "XMPP server with admin webui"
description.fr = "Serveur XMPP avec interface graphique d'administration"

version = "5.1.2~ynh1"

maintainers = ["DeMiro5001"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://igniterealtime.org/projects/openfire/"
admindoc = "https://www.igniterealtime.org/projects/openfire/documentation.jsp"
userdoc = "https://www.igniterealtime.org/projects/openfire/documentation.jsp"
code = "https://github.com/igniterealtime/Openfire"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/openfire"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Use the help field to add an information for the admin about this question."
    help.fr = "Utilisez le champ aide pour ajouter une information à l'intention de l'administrateur à propos de cette question."
    type = "password"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/igniterealtime/Openfire/releases/download/v5.1.2/openfire_5.1.2_all.deb"
    sha256 = "354e14ebf80c03eee05649a43d52338a77797bb41529a4f1486c49e784119f9d"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "mariadb-server, default-jdk"

    [resources.database]
    # This will automatically provision/deprovison a MySQL DB and store the corresponding credentials in settings $db_user, $db_name, $db_pwd
    type = "mysql"
